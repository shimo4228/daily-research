[general]
vault_path = "/path/to/your/obsidian/vault"
output_dir = "daily-research"
language = "ja"
date_format = "%Y-%m-%d"

[report]
min_sources = 5

# === Lines (tracks) ===
# Each track is a research LINE. A line maps to zero or more research repositories
# via [[tracks.<line>.repos]] entries:
#   - Repo-backed line (1..N repos): Pass 1 reads each repo's synced graph
#     (.repo-graphs/<key>.jsonld) plus the coverage report, and picks external
#     research per line. Per-repo selection mode is decided by the coverage report:
#       coverage — the repo still has uncovered / thin concepts; fill the gaps
#       frontier — the repo is saturated; hunt research that CHALLENGES or EXTENDS
#                  existing concepts, guided by the repo's frontier_questions
#     A line with 2+ repos may also produce cross-repo themes.
#   - Free-exploration line (no repos): serendipity-driven. Pass 1 avoids the
#     saturated clusters reported by cluster-report and picks themes from
#     low-frequency / brand-new clusters ("explore" mode).
# `aliases` lists legacy track names whose past_topics.json history should keep
# feeding this line's dedup context.

[tracks.line_a]
name = "Research Line A (repo_a + repo_b)"
focus = "Discover external research that reinforces, challenges, or extends the concept systems of repo A and repo B"
aliases = ["old_track_a1", "old_track_a2"]
sources = [
  "Semantic Scholar (your repos' domain keywords)",
  "arXiv (relevant categories for the repos)",
]
scoring_criteria = [
  { name = "Concept reinforcement / frontier fit", weight = 35, desc = "Coverage mode: reinforces an uncovered or thin concept. Frontier mode: challenges or extends a concept, or answers a frontier question" },
  { name = "Research recency", weight = 25, desc = "Latest 2026 research or development" },
  { name = "Repo frontier fit", weight = 40, desc = "Serves the repos' next direction / open questions" },
]

[[tracks.line_a.repos]]
key = "repo_a"                                   # used for .repo-graphs/<key>.jsonld and theme JSON `repos`
target_repo = "/path/to/your/research-repo-a"
target_graph = ".repo-graphs/repo_a.jsonld"      # cwd-relative path after sync
target_doi = "10.xxxx/zenodo.xxxxxxxx"           # optional; the repo's DOI if it has one
frontier_questions = [
  "A standing open question that should drive theme selection once coverage saturates",
]

[[tracks.line_a.repos]]
key = "repo_b"
target_repo = "/path/to/your/research-repo-b"
target_graph = ".repo-graphs/repo_b.jsonld"
target_doi = "10.xxxx/zenodo.xxxxxxxx"
frontier_questions = []

# A free-exploration line may set `report_variant = "maker"`: its reports then drop
# the counter-evidence section and end with a "development ideas" section (1-3 things
# the reader could build, derived from the research + [user_profile]) instead of the
# research-line connection section.
[tracks.explore]
name = "Free Exploration"
report_variant = "maker"  # optional; omit for the default report format
focus = "Serendipity line: define the domain to explore here (e.g. AI / developer technology). Themes mainly belonging to saturated clusters (including areas the repo-backed lines already cover) are banned — pick untouched sub-areas WITHIN this domain"
aliases = ["old_free_track"]
sources = [
  "Hacker News top stories",
  "GitHub Trending (past 7 days)",
  "arXiv cs.* new papers",
]
scoring_criteria = [
  { name = "Novelty", weight = 30, desc = "No similar theme in past_topics.json" },
  { name = "Serendipity", weight = 30, desc = "Distant from the saturated clusters in cluster-report; ideally a brand-new cluster" },
  { name = "Momentum", weight = 20, desc = "An actively evolving area, not static knowledge" },
  { name = "Whisper trend", weight = 20, desc = "A change not yet widely noticed" },
]

# === Coverage / saturation thresholds ===
[coverage]
frontier_threshold = 0      # repo enters frontier mode when (uncovered + thin concepts) <= this value
saturated_top_n = 15        # cluster repulsion: all-time top-N subClusters are off-limits for the explore line
saturated_recent_days = 90  # ...plus any subCluster hit at least `saturated_recent_min` times in this window
saturated_recent_min = 3

[user_profile]
skills = ["Python", "Swift", "TypeScript", "iOS development"]
interests = ["AI/ML", "Agents", "your research domains"]
goal = "Continuously discover external research that advances the concept systems of the mapped research repositories, plus serendipitous findings from unrelated fields"
