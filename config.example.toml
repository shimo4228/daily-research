[general]
# ノートの置き場。git の作業ツリーの root なら run の最後に commit し、origin があれば push する (lib/notes.sh)
vault_path = "/path/to/your/notes"
output_dir = "daily-research"
# Rotating lines run per morning (ADR-0017). Integer >= 1 (default 1). The window
# advances by lines_per_day each day; daily = true lines run in addition.
lines_per_day = 1
language = "ja"            # informational — not read by scripts (output language lives in prompts/)
date_format = "%Y-%m-%d"   # informational — not read by scripts
# Self-contamination guard (ADR-0008): artifacts matching these strings are never
# counted as "external signals" (third-party mentions/adoptions of them are fine).
self_signals = [
  "github.com/YOUR_GITHUB_HANDLE",
  "Your Name",
]

[report]
min_sources = 5

# Second call (ADR-0017): fresh-context clarity revision + source re-fetch check.
# Results are written to state/<line>/runs/{date}.verify.json and recorded in metrics.
[verification]
model = "sonnet"

# Effort of the two calls, passed as `claude -p --effort` (call1 = research and writing, call2 =
# verification + clarity). Optional: the defaults live in code (dr_pipeline.py _effort) and pin the
# levels the calls ran at before the flag was passed, so changes to your interactive Claude Code
# settings no longer move the unattended run. Values: low, medium, high, xhigh, max; anything else
# stops the run at startup. The run logs "Effort: …" and records `effort` in metrics.jsonl.
# lib/env.sh drops an inherited CLAUDE_CODE_EFFORT_LEVEL (it would outrank --effort).
# [effort]
# call1 = "high"
# call2 = "medium"

# Third call (ADR-0020): a fact audit of each article after call 2 (briefs are not audited).
# Stage 1 checks the note's claims against their sources and lists only the sentences that
# contradict a source; stage 2 re-checks each candidate whose URL is written in the note on its
# own (sentence + stage 1's replacement + URL + note date) and judges whether the replacement
# fixes the error. Both stages use WebFetch only. Only candidates both stages call a
# contradiction, with a fix stage 2 accepts, are replaced, by code, under fixed rules (the
# sentence appears exactly once in the body; a small edit that keeps the note's URLs, links,
# emphasis and headings and adds no markup). The model never writes the note. Results go to
# state/<line>/audit/{date}.json, the pre-audit note to state/<line>/pre-audit/{date}.md, and
# the counts to metrics (verification.audit_*).
# Any failure leaves the note as call 2 left it. Off by default.
[audit]
enabled = false
model = "opus"

# Billing path (scripts/lib/billing.sh; the contract lives in dr_pipeline.py's [billing]).
# mode = "subscription" (default): claude -p uses your Claude Code login (Max plan OAuth);
#   any ANTHROPIC_API_KEY inherited from the environment is dropped.
# mode = "api": every call is billed to the Claude API. credential picks where the
#   credential comes from: "env_file" (default) reads ANTHROPIC_API_KEY from env_file (outside
#   the repo); "ant" uses your Console login from `ant auth login --profile <ant_profile>`
#   (no key to expire): before each call the script asks ant for the current access token and
#   runs claude with a dedicated CLAUDE_CONFIG_DIR (state/claude-config, which never holds a
#   claude.ai login), so a stored claude.ai subscription login cannot take over. Each call gets --max-budget-usd (call1 / call2 / audit /
#   audit_confirm), each call's cost is appended to state/api-spend.jsonl, and a line starts
#   only when both the month's and the day's remaining budget cover the line reserve:
#   call1_max_usd + call2_max_usd, plus audit_max_usd + 5 × audit_confirm_max_usd when
#   [audit] enabled (stage 2 runs for at most 5 candidates per note). The reserve must fit
#   in daily_cap_usd. When a cap is hit, the remaining lines are skipped and you get a
#   notification. A 429, a too-low credit balance or a rejected key stops the remaining lines
#   without retrying.
[billing]
mode = "subscription"
env_file = "~/.config/daily-research/env"
# credential = "ant"        # api mode only; then env_file is not read
# ant_profile = "default"
monthly_cap_usd = 100   # example values — set yours from state/api-spend.jsonl
daily_cap_usd = 10
call1_max_usd = 4
call2_max_usd = 1.5
audit_max_usd = 1           # audit stage 1, per note
audit_confirm_max_usd = 0.25  # audit stage 2, per candidate

# === Lines (tracks) — per-repo in-context research (ADR-0008 / ADR-0010 / ADR-0017) ===
# Each track is a research LINE mapped 1:1 to a research repository via a
# [[tracks.<line>.repos]] entry (lines with mode = "ecosystem" have no repo — see the
# ecosystem example below). Track names must match [A-Za-z0-9_-]+. Write repos with double
# brackets (an array of tables) and give every entry a non-empty key and target_repo: a
# single [tracks.<line>.repos] table or an entry missing either fails the startup schema check.
# Each morning the orchestrator picks a WINDOW of [general].lines_per_day lines:
# k = lines_per_day, n = non-daily line count, day = date.toordinal() (proleptic
# Gregorian ordinal, not Unix epoch day), start = (day * k) % n, lines
# start .. start+k-1 (mod n) in the order they are written in this file
# (ADR-0017; k = 1 is the ADR-0010 phase; `daily = true` lines are excluded from n,
# ADR-0011). Each picked line runs `claude -p` with cwd = target_repo and ends in one
# of four content states — article / brief / quiet / hold — declared in a run
# receipt (state/<line>/runs/{date}.json). The note's frontmatter `kind:` is
# article or brief.
#
# context_files: repo-relative paths offered as candidates to Read AFTER the
# question is chosen (Step 3b), not at the start of the run. Missing files are skipped.
# aliases: former track names — keeps past_topics.json dedup working across
# reorganizations.
# daily: set `daily = true` on a line to run it EVERY morning in addition to the
# rotation (the line is excluded from the rotation cycle; rotation-pick outputs
# the rotated window first, then all daily lines).
# template: optional project-relative path to a per-line report template
# (section structure). Defaults to templates/report-template.md when omitted;
# an unreadable path falls back to the default at runtime (ADR-0015).
# read_deny: optional repo-relative globs the model may not Read (default: none).
# Each target_repo × glob becomes a Read(//abs/glob) deny, and the repo's .git/** is
# denied too (commit messages are readable there). The denies of every line go into
# every line's run (calls can read any absolute path, so another line's run is
# covered as well); Glob / Grep follow Read denies. The repo's recent commit subjects
# given to call 1 leave out commits that touch only these paths. The list is a deny
# list, so also list helper files that hold a copy of private content (for example
# the inputs of a generator script). Use dir/** for a whole directory. Entries must be
# relative, with no "..", "." or empty segments (./x, x//y, a trailing /) and no
# commas, parentheses, whitespace or control characters; with read_deny set,
# target_repo must be a normalized absolute path without those characters or glob
# characters ([ ] * ? { }). The startup schema check rejects anything else.
# sync_before_run: optional per-repos-entry bool (default false; a non-boolean fails the
# startup schema check). With true, the script fast-forwards that repo to its upstream
# before the line's call 1 (git fetch + git merge --ff-only @{u}, repo hooks off, no
# credential prompt, time-limited) and logs one "SYNC <line>: ..." line per repo. A dirty
# tree, a detached HEAD, a branch without upstream, a diverged branch, a fetch failure or
# a timeout is logged as "skip: <reason>" and the line runs on the local copy as it is.
# A fast-forward that touches .claude/ (at any depth), .mcp.json, .gitattributes,
# .gitmodules or .lfsconfig is not made ("skip: protected path changed"): the run's cwd
# is the repo and its .claude/settings.json applies even in safe mode, so the operator
# pulls such changes by hand after reading them.
# Leave it off for a repo you work on locally; it is for a repo whose changes happen
# elsewhere and are pushed to origin. A new path that arrives with the fast-forward is
# readable unless read_deny lists it.

[tracks.example_line]
name = "Example Line 前進"
# daily = true  # uncomment to run this line every day instead of in rotation
# template = "templates/report-template-example.md"  # per-line section structure override
focus = "example-repo が扱う主題 (例: agent の知識循環) の外部動向"
aliases = []
context_files = [".notes/TASKS.md", "docs/manifesto.md"]
# read_deny = ["private/**", "logs/*.md"]  # repo paths the model may not read
sources = [
  "arXiv / Semantic Scholar (your domain keywords)",
  "関連 venue / registry / standard の新規開設・仕様変更",
]

[[tracks.example_line.repos]]
key = "example"
target_repo = "/Users/YOUR_USERNAME/path/to/example-repo"
target_doi = "10.5281/zenodo.XXXXXXX"  # optional; informational — not read by scripts
# sync_before_run = true  # fast-forward this repo before the run (see above)

# === Ecosystem line (mode = "ecosystem", ADR-0018) ===
# mode: "repo" (default, may be omitted) or "ecosystem". An ecosystem line has NO target
# repository: it observes an external ecosystem itself (new OSS, tools, releases, design
# trends), not "external developments relevant to a repo". It runs `claude -p` with
# cwd = state/<line>/ (line-local state is the only local context), uses
# prompts/ecosystem-research-protocol.md. Like every line it runs with --safe-mode
# (ADR-0019); safe mode does NOT switch off permissions, so the boundary stays
# --disallowedTools. Ecosystem lines add denies for writing .claude/ / CLAUDE.md /
# .mcp.json into state/<line>/ (the cwd is model-writable). The receipt gate, the four content
# states, and the verification call are identical to repo lines; the write targets are the repo
# line's plus the two watchlist files below. `repos`, `context_files` and `read_deny` are
# rejected by the schema for this mode.
# The watchlist lives in state/<line>/watched-sources.md (format and row cap: see the
# protocol); rows taken off the table move to state/<line>/watched-archive.md;
# duplicates are judged by "what changed since the last report", not by topic name.
# Combine with `daily = true` to observe every morning outside the rotation window.

[tracks.example_ecosystem_line]
name = "Example Ecosystem 観測"
mode = "ecosystem"
daily = true
template = "templates/report-template-ecosystem.md"
focus = "観測対象のエコシステム (例: ある新しいモデル / プロトコル / ランタイムの周辺) で、前回報告以降に起きた変化。対象の範囲と、見るべき点 (実装の実在・実測・いま試せるか) を書く"
aliases = []
sources = [
  "公式サイト / 公式ドキュメント / 公式 GitHub organization",
  "GitHub 検索・パッケージレジストリ (新規 repository・release)",
  "まとめ list (未知候補の入口としてのみ。掲載は採用根拠にしない)",
]

# [user_profile] is informational — not read by scripts.
[user_profile]
skills = ["Python"]
interests = ["AI/ML"]
goal = "研究 repo の外部環境を毎朝監視し、外部動向の解説と repo への含意を前提知識ゼロで読める解説レポートとして受け取る"
