[general]
vault_path = "/path/to/your/obsidian/vault"
output_dir = "daily-research"
language = "ja"
date_format = "%Y-%m-%d"
# Self-contamination guard (ADR-0008): artifacts matching these strings are never
# counted as "external signals" (third-party mentions/adoptions of them are fine).
self_signals = [
  "github.com/YOUR_GITHUB_HANDLE",
  "Your Name",
]

[report]
min_sources = 5

# === Lines (tracks) — per-repo in-context research (ADR-0008) ===
# Each track is a research LINE mapped 1:1 to a research repository via a
# [[tracks.<line>.repos]] entry. Every night the orchestrator runs `claude -p`
# once per line with cwd = target_repo, so the run reads the repo's own
# operational context (CLAUDE.md auto-loads; context_files are read explicitly)
# and produces an actionable-tactics note in the vault.
#
# context_files: repo-relative paths the run must Read in Step 1 (task ledger,
# open questions, implementation log). Missing files are skipped.
# aliases: former track names — keeps past_topics.json dedup working across
# reorganizations.

[tracks.example_line]
name = "Example Line 前進"
focus = "example-repo line を今すぐ前に進める実行可能な手の発見 — 新 venue / 新機構 / 期限付き機会 / 反証"
aliases = []
context_files = [".notes/TASKS.md", "docs/manifesto.md"]
sources = [
  "arXiv / Semantic Scholar (your domain keywords) — ただし文献は手か反証になる場合のみ",
  "関連 venue / registry / standard の新規開設・仕様変更",
]
scoring_criteria = [
  { name = "実行可能性", weight = 45, desc = "調べた結果が、運用者が今週実行できる具体的な手になるか" },
  { name = "期限性・鮮度", weight = 25, desc = "期限付き機会か。1 週間で陳腐化する前に動く価値があるか" },
  { name = "反証性・前進性", weight = 30, desc = "repo の前提・open question を動かし、次の行動を変えるか" },
]

[[tracks.example_line.repos]]
key = "example"
target_repo = "/Users/YOUR_USERNAME/path/to/example-repo"
target_doi = "10.5281/zenodo.XXXXXXX"  # optional

[user_profile]
skills = ["Python"]
interests = ["AI/ML"]
goal = "研究 repo を今すぐ前に進める実行可能な手を毎朝発見する (裏付けの蓄積ではなく行動の変化が成果)"
