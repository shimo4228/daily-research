# daily-research は shell + stdlib python のプロジェクト (build 対象ではない)。
# この pyproject.toml は dev 層 (pytest / ruff) の設定だけを持つ。
# ランタイム本体は launchd 上で stdlib python のみで動く (pytest は dev/test 専用)。
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
pythonpath = ["scripts/lib"]
addopts = [
    "--strict-markers",
    "--cov=dr_pipeline",
    "--cov-report=term-missing",
]
markers = [
    "unit: unit tests for dr_pipeline subcommands",
]

# ruff は dev 専用の lint / format ゲート (ランタイムには載らない)。実行は .claude/verify.sh
# (版の pin と選定理由は .claude/verify.md)。select はバグクラス検出・diff 安定 (import 順) ・
# 複雑度の予算・危険な構文に絞る — 見た目の規約 (docstring・命名) は入れない。
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # pyflakes / pycodestyle の誤り系 (ruff 既定)
    "B",                    # bugbear: 可変既定引数・ループ変数の捕捉など
    "BLE",                  # 裸の except Exception (意図的な箇所は理由付き noqa)
    "I",                    # import 順 (diff 安定)
    "UP",                   # target-version より古い構文
    "RUF",                  # ruff 固有の誤り系
    "C90",                  # 複雑度の予算 (mccabe)
    "S",                    # bandit: 危険な構文
]
ignore = [
    # 日本語の全角括弧・句読点を曖昧文字として検出するため (文字列 / docstring / コメント)
    "RUF001", "RUF002", "RUF003",
    # git を argv のリストで呼ぶ (shell なし)。PATH は lib/env.sh がサニタイズする
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
# test は assert で書き、fixture の一時ファイルを使う
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.mccabe]
# prune, don't raise — record changes in .claude/verify.md with a dated reason
max-complexity = 23
